name: model-router

on:
  pull_request:
    paths:
      - 'plugins/model-router/**'
      - '.github/workflows/model-router.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/model-router/**'
      - '.github/workflows/model-router.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: plugins/model-router/package-lock.json
      - name: Install and verify
        working-directory: plugins/model-router
        run: |
          npm ci
          npm run check
